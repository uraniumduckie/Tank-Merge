<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect to Tank Merge</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  color: #eee;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
}
.container {
  background: #16213e;
  padding: 40px;
  border-radius: 12px;
  text-align: center;
  width: 420px;
}
h1 { font-size: 28px; margin-bottom: 8px; }
p { color: #aaa; margin-bottom: 24px; font-size: 14px; }
input {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid #333;
  border-radius: 8px;
  background: #0f3460;
  color: #eee;
  font-size: 16px;
  margin-bottom: 16px;
  outline: none;
}
input:focus { border-color: #e94560; }
button {
  background: #e94560;
  color: #fff;
  border: none;
  padding: 12px 32px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  width: 100%;
}
button:hover { background: #d63852; }
.error { color: #e94560; margin-top: 12px; font-size: 13px; display: none; }
.hint { color: #666; font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
<div class="container">
  <h1>Tank Merge</h1>
  <p>Enter the server address to connect</p>
  <input type="text" id="serverUrl" placeholder="http://192.168.1.5:3001">
  <button id="connectBtn">Connect</button>
  <div class="error" id="errorMsg">Invalid URL. Use http://ip:port</div>
  <div class="hint">Ask the host for their address</div>
</div>
<script>
const { ipcRenderer } = require('electron');
const input = document.getElementById('serverUrl');
const btn = document.getElementById('connectBtn');
const error = document.getElementById('errorMsg');

btn.addEventListener('click', () => {
  let url = input.value.trim();
  if (!url.startsWith('http://') && !url.startsWith('https://')) {
    url = 'http://' + url;
  }
  try {
    new URL(url);
    error.style.display = 'none';
    ipcRenderer.send('connect', url);
  } catch {
    error.style.display = 'block';
  }
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') btn.click();
});

ipcRenderer.on('saved-url', (_, url) => {
  input.value = url;
});
</script>
</body>
</html>
